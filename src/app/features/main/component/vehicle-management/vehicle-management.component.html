<div class="vehicle-management m-2">
  <div class="container-fluid media-viewer">
    <!-- Tiêu đề -->
    <div class="row">
      <div class="col-12 mb-4">
        <h6 class="m-0 text-primary font-weight-bolder">XEM ẢNH PHƯƠNG TIỆN</h6>
      </div>
    </div>

    <!-- Thanh lọc -->
    <div class="row">
      <div class="col-12">
        <div class="filter-bar d-flex flex-wrap align-items-center">
          <!-- Dropdown nhóm -->
          <div class="dropdown mr-1 mb-2">
            <button
              type="button"
              class="btn btn-outline-primary rounded-0"
              style="height: 36px; width: clamp(200px, 30vw, 330px)"
              (click)="toggleGroupDropdown()"
            >
              {{
                selectedGroupIds.length > 0
                  ? "Đã chọn " + selectedGroupIds.length + " nhóm"
                  : "Chọn nhóm phương tiện"
              }}
              <span class="dropdown-caret" [class.rotate]="isGroupDropdownOpen">
                <i class="bi bi-caret-down-fill"></i>
              </span>
            </button>

            <div
              class="dropdown-menu w-100 mt-0 rounded-0"
              [class.show]="isGroupDropdownOpen"
            >
              <!-- Input search -->
              <div class="position-relative px-2 mb-2">
                <input
                  type="text"
                  [(ngModel)]="searchTerm"
                  class="form-control form-control-sm search-input"
                  placeholder="Tìm nhóm"
                  (ngModelChange)="filterGroups()"
                  style="height: 30px"
                />
                <i class="bi bi-search search-icon"></i>
              </div>

              <!-- Chọn tất cả -->
              <div class="dropdown-item">
                <input
                  id="vehicle_all"
                  type="checkbox"
                  class="mr-2"
                  (change)="toggleAll($event)"
                />
                <label for="vehicle_all">Tất cả ({{ groups.length }})</label>
              </div>

              <!-- Danh sách nhóm -->
              <ng-container *ngFor="let group of filterGroups()">
                <div class="dropdown-item">
                  <input
                    type="checkbox"
                    [id]="'vehicle_' + group.pkVehicleGroupId"
                    class="mr-2"
                    [checked]="
                      selectedGroupIds.includes(group.pkVehicleGroupId)
                    "
                    (change)="onCheckboxChange($event, group.pkVehicleGroupId)"
                  />
                  <label [for]="'vehicle_' + group.pkVehicleGroupId">
                    {{ group.name }} ({{ group.vehicleCount || 0 }})
                  </label>
                </div>
              </ng-container>
              <div *ngIf="filterGroups().length === 0" class="px-2">
                Không có dữ liệu
              </div>
            </div>
          </div>

          <!-- Dropdown xe -->
          <div class="dropdown mr-1 mb-2">
            <button
              type="button"
              class="btn btn-outline-primary rounded-0 w-100"
              style="height: 36px; width: clamp(200px, 30vw, 330px)"
              (click)="toggleVehicleDropdown()"
            >
              {{
                selectedVehicle
                  ? selectedVehicle.privateCode +
                    " (" +
                    selectedVehicle.vehiclePlate +
                    ")"
                  : "Chọn xe"
              }}
              <span
                class="dropdown-caret"
                [class.rotate]="isVehicleDropdownOpen"
              >
                <i class="bi bi-caret-down-fill"></i>
              </span>
            </button>
            <div
              class="dropdown-menu w-100 mt-0 rounded-0"
              [class.show]="isVehicleDropdownOpen"
            >
              <ng-container *ngFor="let vehicle of vehicles">
                <a
                  class="dropdown-item"
                  href="javascript:void(0)"
                  (click)="selectVehicle(vehicle.pkVehicleId)"
                >
                  {{ vehicle.privateCode }} ({{ vehicle.vehiclePlate }})
                </a>
              </ng-container>
              <div *ngIf="vehicles.length === 0" class="px-2">
                Không có dữ liệu
              </div>
            </div>
          </div>

          <!-- Dropdown kênh -->
          <div class="dropdown mr-1 mb-2">
            <button
              type="button"
              class="btn btn-outline-primary rounded-0 w-100"
              style="height: 36px; width: clamp(200px, 30vw, 330px)"
              (click)="toggleChannelDropdown()"
            >
              {{
                selectedChannels.length > 0
                  ? "Đã chọn " + selectedChannels.length + " kênh"
                  : "Chọn kênh"
              }}
              <span
                class="dropdown-caret"
                [class.rotate]="isChannelDropdownOpen"
              >
                <i class="bi bi-caret-down-fill"></i>
              </span>
            </button>
            <div
              class="dropdown-menu w-100 mt-0 rounded-0"
              [class.show]="isChannelDropdownOpen"
            >
              <div class="dropdown-item">
                <input
                  id="channel_all"
                  type="checkbox"
                  class="mr-2"
                  (change)="toggleAllChannels($event)"
                />
                <label for="channel_all">Tất cả ({{ channels.length }})</label>
              </div>
              <ng-container *ngFor="let channel of channels">
                <div class="dropdown-item">
                  <input
                    type="checkbox"
                    [id]="'channel_' + channel.id"
                    class="mr-2"
                    [(ngModel)]="channel.checked"
                    (ngModelChange)="updateSelectedChannels()"
                  />
                  <label [for]="'channel_' + channel.id">{{
                    channel.name
                  }}</label>
                </div>
              </ng-container>
              <div *ngIf="channels.length === 0" class="px-2">
                Không có dữ liệu
              </div>
            </div>
          </div>

          <!-- Dropdown sắp xếp -->
          <div class="dropdown mr-1 mb-2">
            <button
              type="button"
              class="btn btn-outline-primary rounded-0 w-100"
              style="height: 36px; width: clamp(150px, 30vw, 200px)"
              (click)="toggleSortDropdown()"
            >
              {{ selectedSort.name }}
              <span class="dropdown-caret" [class.rotate]="isSortDropdownOpen">
                <i class="bi bi-caret-down-fill"></i>
              </span>
            </button>
            <div
              class="dropdown-menu w-100 mt-0 rounded-0"
              [class.show]="isSortDropdownOpen"
            >
              <ng-container *ngFor="let option of sortOptions">
                <a
                  class="dropdown-item"
                  href="javascript:void(0)"
                  (click)="selectSort(option)"
                  [ngClass]="{
                    'font-weight-bold': selectedSort.id === option.id
                  }"
                >
                  {{ option.name }}
                </a>
              </ng-container>
            </div>
          </div>

          <!-- Ngày / Giờ -->
          <div class="d-flex flex-wrap align-items-center mr-1 mb-2">
            <!-- Ngày -->
            <div
              class="input-group mr-1 mb-2 mb-lg-0"
              style="width: clamp(100px, 30vw, 150px); height: 36px"
            >
              <input
                type="date"
                class="form-control rounded-0"
                [max]="maxDate"
                [min]="minDate"
                [(ngModel)]="selectedDate"
                style="height: 36px; font-size: 14px"
              />
              <div class="input-group-append">
                <span
                  class="input-group-text p-0 px-2"
                  style="font-size: 14px; background-color: #e9ecef"
                >
                  <i class="bi bi-calendar4-event"></i>
                </span>
              </div>
            </div>

            <!-- Giờ bắt đầu -->
            <div
              class="input-group mr-1 mb-2 mb-lg-0"
              style="width: 100px; height: 36px"
            >
              <input
                type="time"
                class="form-control rounded-0"
                [(ngModel)]="startTime"
                (change)="validateTime()"
                style="height: 36px; font-size: 14px"
              />
              <div class="input-group-append">
                <span
                  class="input-group-text p-0 px-2"
                  style="font-size: 14px; background-color: #e9ecef"
                >
                  <i class="bi bi-clock"></i>
                </span>
              </div>
            </div>

            <!-- Giờ kết thúc -->
            <div
              class="input-group mr-1 mb-2 mb-lg-0"
              style="width: 100px; height: 36px"
            >
              <input
                type="time"
                class="form-control rounded-0"
                [(ngModel)]="endTime"
                (change)="validateTime()"
                style="height: 36px; font-size: 14px"
              />
              <div class="input-group-append">
                <span
                  class="input-group-text p-0 px-2"
                  style="font-size: 14px; background-color: #e9ecef"
                >
                  <i class="bi bi-clock"></i>
                </span>
              </div>
            </div>
          </div>

          <!-- Nút tìm kiếm -->
          <div class="mr-1 mb-2">
            <button
              type="button"
              class="btn btn-primary d-inline-flex align-items-center justify-content-center"
              style="height: 36px; width: clamp(80px, 20vw, 100px)"
              (click)="searchImages()"
              [disabled]="!selectedVehicle"
            >
              <i class="bi bi-search mr-1"></i>
              <span>Tìm kiếm</span>
            </button>
          </div>

          <!-- Chế độ số ảnh hiển thị -->
          <div class="d-flex flex-wrap mb-2">
            <button
              type="button"
              class="btn d-flex align-items-center justify-content-center mr-1"
              *ngFor="let option of imagePerRowOptions"
              [ngClass]="{
                'btn-primary': selectedImagePerRow === option,
                'btn-secondary': selectedImagePerRow !== option
              }"
              (click)="setImagePerRow(option)"
              style="height: 36px; width: 60px"
            >
              <span>{{ option }}</span>
              <i
                class="bi bi-image-fill ml-1"
                [ngClass]="{ 'text-white': selectedImagePerRow === option }"
              ></i>
            </button>
          </div>

          <!-- Thông báo lỗi -->
          <div class="w-100" *ngIf="timeError">
            <div class="text-danger">Giờ kết thúc phải sau giờ bắt đầu</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="container-fluid vehicle-item mt-3">
  <!-- Danh sách ảnh -->
  <div
    class="media-gallery border"
    style="height: calc(100vh - 250px); overflow-y: auto; overflow-x: hidden"
  >
    <div class="row no-gutters">
      <!-- 1 item ảnh -->
      <div class="col-2 p-2" *ngFor="let img of images">
        <div class="card h-100 shadow-sm">
          <img
            src="https://cdn-media.sforum.vn/storage/app/media/anh-dep-68.jpg"
            class="card-img-top img-fluid"
            alt="Ảnh phương tiện"
            style="cursor: pointer; width: 100%; height: auto"
          />

          <!-- Thông tin -->
          <div class="card-body p-2">
            <div class="d-flex justify-content-between align-items-start">
              <!-- Bên trái: thông tin -->
              <div class="d-flex flex-column">
                <div class="small">
                  <i class="bi bi-clock mr-1"></i>
                  <span class="text-primary">10/04/2025</span>
                </div>
                <div class="small">
                  <span class="text-primary">09:59:50</span>
                </div>
                <div class="small">
                  <i class="bi bi-camera-video-fill mr-1"></i>
                  <span>Kênh 1</span>
                </div>
                <div class="small">
                  <i class="bi bi-geo-alt-fill mr-1"></i>
                  <span>Bãi đỗ 49 đức giang</span>
                </div>
              </div>

              <!-- Bên phải: tốc độ + download (hàng ngang) -->
              <div class="d-flex align-items-center">
                <div class="small mr-2">
                  <i class="bi bi-speedometer2 mr-1"></i>
                  <span>123 km/h</span>
                </div>
                <button
                  class="btn rounded-circle d-flex align-items-center justify-content-center p-0"
                  style="
                    width: 20px;
                    height: 20px;
                    background-color: #20c997;
                    border: none;
                  "
                >
                  <i
                    class="bi bi-download text-white"
                    style="font-size: 10px; position: relative; left: -0.5px"
                  ></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- end item -->
    </div>
  </div>

  <!-- Phân trang -->
  <div
    class="d-flex align-items-center justify-content-between mt-2 p-2"
    style="background-color: #e9ecef"
  >
    <!-- Trái: nút phân trang + chọn pageSize -->
    <div class="d-flex align-items-center">
      <!-- Nút phân trang -->
      <nav aria-label="Page navigation" class="mr-3">
        <ul class="pagination pagination-sm mb-0">
          <li class="page-item">
            <a class="page-link border-0 bg-transparent text-dark" href="#"
              ><i class="bi bi-skip-start-fill"></i
            ></a>
          </li>
          <li class="page-item">
            <a class="page-link border-0 bg-transparent text-dark" href="#"
              ><i class="bi bi-caret-left-fill"></i
            ></a>
          </li>
          <li class="page-item active">
            <a
              class="page-link border-0 text-white"
              href="#"
              style="background-color: #57b0e2"
              >1</a
            >
          </li>
          <li class="page-item">
            <a class="page-link border-0 bg-transparent text-dark" href="#"
              >2</a
            >
          </li>
          <li class="page-item">
            <a class="page-link border-0 bg-transparent text-dark" href="#"
              >3</a
            >
          </li>
          <li class="page-item">
            <a class="page-link border-0 bg-transparent text-dark" href="#"
              ><i class="bi bi-caret-right-fill"></i
            ></a>
          </li>
          <li class="page-item">
            <a class="page-link border-0 bg-transparent text-dark" href="#"
              ><i class="bi bi-skip-end-fill"></i
            ></a>
          </li>
        </ul>
      </nav>

      <!-- Chọn pageSize -->
      <div class="form-inline">
        <div class="position-relative d-inline-block">
          <select
            class="form-control form-control-sm pr-4 py-0 text-dark"
            style="
              appearance: none;
              -webkit-appearance: none;
              -moz-appearance: none;
              width: 70px;
              height: calc(1.5em + 0.5rem);
              background-color: #d6d8db; /* nền đậm hơn thanh phân trang */
              border: none;
            "
          >
            <option>10</option>
            <option>20</option>
            <option selected>50</option>
            <option>100</option>
          </select>
          <!-- Icon caret -->
          <i
            class="bi bi-caret-down-fill position-absolute text-dark"
            style="
              right: 10px;
              top: 50%;
              transform: translateY(-50%);
              pointer-events: none;
            "
          ></i>
        </div>
        <span class="small ml-2">ảnh mỗi trang</span>
      </div>
    </div>

    <!-- Phải: tổng số -->
    <div class="small text-muted">1 - 50 / 80 ảnh</div>
  </div>
</div>
