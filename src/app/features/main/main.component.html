<div class="main-slider position-relative">
    <div id="newsCarousel" class="carousel slide" (mouseleave)="onSliderLeave()">

        <div class="carousel-indicators-custom d-flex justify-content-center">
            <span *ngFor="let item of newsItems.slice(0,5); let i = index" (click)="goToSlide(i)" class="mx-1">
                <i class="bi" [ngClass]="i === currentSlide ? 'bi-record2' : 'bi-record-fill'"></i>
            </span>
        </div>

        <div class="carousel-inner">
            <div *ngFor="let item of (newsItems.length ? newsItems : [defaultBanner]).slice(0,5); let i = index"
                class="carousel-item" [class.active]="i === currentSlide">
                <a [href]="item.link" target="_blank">
                    <img [src]="item.image" class="d-block w-100 img-fluid" alt="{{item.title}}">
                </a>

                <div class="left-caption d-flex align-items-center justify-content-between">
                    <div class="text-content w-75">
                        <h5 class="font-weight-bolder">{{ item.title }}</h5>
                        <p class="text-truncate-2">{{ item.shortContents }}</p>
                    </div>
                    <a *ngIf="item.link" [href]="item.link" target="_blank"
                        class="text-decoration-underline text-dark rounded-pill bg-success btn-sm ml-3">
                        {{ 'MAIN.NEWS.DETAIL' | translate }} <i class="bi bi-arrow-right-short"></i>
                    </a>
                </div>
            </div>
        </div>

        <a class="carousel-control-prev" (click)="prevSlide()">
            <span class="carousel-control-prev-icon"></span>
        </a>
        <a class="carousel-control-next" (click)="nextSlide()">
            <span class="carousel-control-next-icon"></span>
        </a>
    </div>

    <div class="login-form-overlay card p-4">
        <img src="assets/images/logo/logo.png" width="100" height="100" class="img-fluid py-4 mx-auto d-block">

        <form (ngSubmit)="onLogin()" class="d-flex flex-column h-100">

            <div class="form-group">
                <div class="input-group">
                    <div class="input-group-prepend">
                        <span class="input-group-text bg-transparent border-0 position-absolute"
                            style="z-index: 10; left: 15px;">
                            <i class="bi bi-person-fill text-muted"></i>
                        </span>
                    </div>
                    <input type="text" class="form-control rounded-pill" style="padding-left: 3.5rem;"
                        [(ngModel)]="username" name="username" placeholder="{{ 'MAIN.LOGIN.USERNAME' | translate }}">
                </div>
                <small class="text-danger" *ngIf="usernameError">{{usernameError}}</small>
            </div>

            <div class="form-group">
                <div class="input-group">
                    <div class="input-group-prepend">
                        <span class="input-group-text bg-transparent border-0 position-absolute"
                            style="z-index: 10; left: 15px;">
                            <i class="bi bi-lock-fill text-muted"></i>
                        </span>
                    </div>
                    <input [type]="showPassword ? 'text' : 'password'" class="form-control rounded-pill"
                        style="padding-left: 3.5rem; padding-right: 3.5rem;" [(ngModel)]="password" name="password"
                        placeholder="{{ 'MAIN.LOGIN.PASSWORD' | translate }}">
                    <div class="input-group-append">
                        <span class="input-group-text bg-transparent border-0 position-absolute"
                            style="z-index: 10; right: 15px; cursor: pointer;" (click)="showPassword = !showPassword">
                            <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                        </span>
                    </div>
                </div>
                <small class="text-danger" *ngIf="passwordError">{{passwordError}}</small>
            </div>

            <div class="form-group d-flex align-items-center justify-content-between">
                <div class="form-check mb-0 d-flex align-items-center">
                    <input type="checkbox" class="form-check-input" style="width: 20px; height: 15px;"
                        [(ngModel)]="rememberMe" name="rememberMe" id="rememberMe">
                    <label class="form-check-label small mb-0 ml-1" for="rememberMe">{{ 'MAIN.LOGIN.REMEMBER' | translate
                        }}</label>
                </div>
                <a href="#" class="forgot-password small d-flex align-items-center">{{ 'MAIN.LOGIN.FORGOT' | translate
                    }}</a>
            </div>

            <button type="submit" class="btn btn-success btn-block rounded-pill shadow-none border-0">
                {{ 'MAIN.LOGIN.SUBMIT' | translate }}
            </button>
            <small class="text-danger d-block mt-2" *ngIf="loginError">{{loginError}}</small>

            <div class="text-center mt-auto">
                <img src="assets/images/img/qr.png" width="100" height="100" class="img-fluid" alt="QR">
                <p class="qr-text mt-2 mb-0 small">{{ 'MAIN.LOGIN.QR_TEXT' | translate }}</p>
            </div>
        </form>
    </div>
</div>
