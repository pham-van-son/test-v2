<footer class="main-footer bg-white text-white">
  <div class="container-fluid px-custom">
    <div class="row">
      <div
        *ngFor="let branch of branches"
        class="col-sm-12 col-md-6 col-lg-4 col-xl-1-7 mb-4 text-center text-lg-left footer-branch"
      >
        <h6 class="mb-3 font-weight-bold text-primary">
          {{ branch.name | translate }}
        </h6>
        <ul class="list-unstyled text-decoration-none font-weight-normal">
          <li *ngFor="let addr of branch.addresses">
            {{ addr }}
          </li>
        </ul>
      </div>

      <div
        class="col-sm-12 col-md-12 col-lg-12 col-xl-1-7 mb-4 d-xl-flex flex-xl-column align-items-xl-end text-center text-xl-left"
      >
        <div *ngFor="let app of appDownload" class="py-1">
          <a [href]="app.url" target="_blank">
            <img [src]="app.image" [alt]="app.alt" height="35">
          </a>
        </div>
        <div class="d-flex align-items-center justify-content-center">
          <a
            *ngFor="let social of socialMedia"
            [href]="social.url"
            class="social-icon"
            target="_blank"
          >
            <img [src]="social.image" [alt]="social.name" height="24" width="24">
          </a>
        </div>
      </div>
    </div>
  </div>
</footer>
