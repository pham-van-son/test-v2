<div 
  class="card chart-card" 
  [class.h-100]="visible"
>
  <div class="chart-header d-flex justify-content-between align-items-center">
    <span class="text-primary font-weight-bold">
      {{ title | translate }}
    </span>
    <div class="d-flex align-items-center">
      <button 
        class="btn btn-light btn-sm mr-1" 
        (click)="toggleChart()"
      >
        <i
          class="bi"
          [ngClass]="visible ? 'bi-chevron-down' : 'bi-chevron-up'"
        ></i>
      </button>
      <button
        type="button"
        class="btn btn-light btn-sm mr-1"
        (click)="refreshChart()"
      >
        <i class="bi bi-arrow-clockwise"></i>
      </button>
      <div
        class="btn-group custom-widget-width-dropdown"
        (mouseleave)="closeWidgetWidthDropdown()"
      >
        <button
          type="button"
          class="btn btn-light btn-sm"
          (mouseenter)="openWidgetWidthDropdown()"
          aria-haspopup="true"
          [attr.aria-expanded]="widgetWidthDropdownOpen"
        >
          <i class="bi bi-three-dots-vertical"></i>
        </button>
        <div class="dropdown-menu" [class.show]="widgetWidthDropdownOpen">
          <div
            class="dropdown-item d-flex align-items-center justify-content-between"
            (mouseenter)="showWidgetWidthSubmenu = true"
            (mouseleave)="showWidgetWidthSubmenu = false"
            style="cursor: pointer"
          >
            {{ "DASHBOARD.COMMON.WIDTH" | translate }}
            <i class="bi bi-chevron-compact-right"></i>
            <div
              class="dropdown-menu"
              [class.show]="showWidgetWidthSubmenu"
              style="
                right: 100%;
                left: auto;
                top: 0;
                min-width: 140px;
                position: absolute;
              "
            >
              <button
                class="dropdown-item d-flex justify-content-between align-items-center"
                (click)="setWidgetWidth('auto')"
              >
                {{ "DASHBOARD.COMMON.AUTO" | translate }}
                <i
                  *ngIf="widgetWidth === 'auto'"
                  class="bi bi-check2 text-primary ml-2"
                ></i>
              </button>
              <button
                class="dropdown-item d-flex justify-content-between align-items-center"
                (click)="setWidgetWidth('small')"
              >
                {{ "DASHBOARD.COMMON.SMALL" | translate }}
                <i
                  *ngIf="widgetWidth === 'small'"
                  class="bi bi-check2 text-primary ml-2"
                ></i>
              </button>
              <button
                class="dropdown-item d-flex justify-content-between align-items-center"
                (click)="setWidgetWidth('medium')"
              >
                {{ "DASHBOARD.COMMON.MEDIUM" | translate }}
                <i
                  *ngIf="widgetWidth === 'medium'"
                  class="bi bi-check2 text-primary ml-2"
                ></i>
              </button>
              <button
                class="dropdown-item d-flex justify-content-between align-items-center"
                (click)="setWidgetWidth('large')"
              >
                {{ "DASHBOARD.COMMON.LARGE" | translate }}
                <i
                  *ngIf="widgetWidth === 'large'"
                  class="bi bi-check2 text-primary ml-2"
                ></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div 
    *ngIf="visible" 
    class="card-body"
  >
    <div class="scrollable-chart">
      <canvas
        baseChart
        [style.width]="getCanvasWidth()"
        [style.height]="'300px'"
        [datasets]="barData.datasets"
        [labels]="barData.labels"
        [options]="barOptions"
        [type]="barType"
      >
      </canvas>
    </div>
  </div>
</div>
